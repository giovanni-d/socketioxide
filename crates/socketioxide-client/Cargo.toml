[package]
name = "socketioxide-client"
description = "Socket.IO client implementation in rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
rustls = ["dep:rustls", "tokio-tungstenite/__rustls-tls"]
rustls-webpki-roots = ["rustls", "dep:webpki-roots"]
rustls-native-roots = ["rustls", "dep:rustls-native-certs"]

[dependencies]
engineioxide-client = { path = "../engineioxide-client", version = "0.1", default-features = false }
socketioxide-core = { path = "../socketioxide-core", version = "0.20" }
socketioxide-parser-common = { path = "../parser-common", version = "0.17.3" }

bytes.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite.workspace = true
tower-service.workspace = true

# TLS
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
webpki-roots = { version = "1", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
socketioxide = { path = "../socketioxide" }
futures-util = { workspace = true, features = ["sink"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
